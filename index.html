<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Embarques — Rodriaço</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --orange:#FF7A29;
    --orange-dark:#C55A11;
    --black:#0B0B0D;
    --blue:#1657D6;
    --blue-dark:#0E3F9E;
    --green:#1EA354;
    --red:#E52020;
    --purple:#7C4DDC;
    --gray:#7A8290;
    --bg1:#DCE9F7;
    --bg2:#EEF3FA;
    --border:#D7DEE8;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Segoe UI',Calibri,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%);
    color:#1a1a1a;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(120deg,#000 0%,#161616 55%,#000 100%);
    padding:14px 28px;
    display:flex;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    position:relative;
    z-index:2;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand .name{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:800;
    font-size:clamp(24px,3vw,34px);
    background:linear-gradient(90deg,#FF9A4D,var(--orange) 60%,var(--orange-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:1px;
  }
  .brand .sub{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    border-left:2px solid #444;
    padding-left:14px;
  }
  .brand .sub .tagline{ font-size:11px; color:#c9c9c9; letter-spacing:1.5px; text-transform:uppercase; }
  .brand .sub .partner{ font-size:15px; font-weight:700; color:#7fb1ff; letter-spacing:0.5px; }

  .title-wrap{
    flex:1;
    text-align:center;
    min-width:260px;
  }
  .title-wrap h1{
    margin:0;
    font-size:clamp(18px,2.6vw,30px);
    letter-spacing:2px;
    font-weight:800;
    color:#fff;
    text-shadow:0 0 18px rgba(255,122,41,0.55);
  }
  .title-wrap h1 span{ color:var(--orange); }
  .title-wrap .clock{
    margin-top:2px;
    font-size:12px;
    color:#9aa3af;
    letter-spacing:1px;
  }

  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat{
    background:#17191d;
    border:1px solid #2b2f36;
    border-radius:10px;
    padding:8px 16px;
    text-align:center;
    min-width:78px;
  }
  .stat .lbl{ font-size:10px; letter-spacing:1px; color:#9aa3af; text-transform:uppercase; font-weight:700; }
  .stat .val{ font-size:26px; font-weight:800; line-height:1.1; margin-top:2px; }
  .stat.entregue .val{ color:var(--green); }
  .stat.emrota .val{ color:#4C93FF; }
  .stat.semana .val{ color:var(--purple); }
  .stat.hoje .val{ color:var(--orange); }
  .stat.atrasado .val{ color:var(--red); }
  .stat.atrasado.alert{
    border-color:var(--red);
    animation:pillBlink 1.1s infinite;
  }
  @keyframes pillBlink{
    0%,100%{ background:#17191d; box-shadow:0 0 0 rgba(229,32,32,0); }
    50%{ background:#3a0e0e; box-shadow:0 0 22px rgba(229,32,32,0.75); }
  }

  #errorBanner{
    display:none;
    background:#FDECEC;
    border-bottom:2px solid var(--red);
    color:#8a1f1f;
    padding:8px 20px;
    font-size:13px;
    text-align:center;
  }

  /* ---------- WEEK GRID ---------- */
  main{
    flex:1;
    min-height:0;
    padding:18px 20px 22px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .week-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
  }
  .day-col{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:rgba(255,255,255,0.55);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 16px rgba(20,40,80,0.08);
    backdrop-filter:blur(2px);
  }
  /* só na primeira pintura — em atualizações, refazer o fade faz o quadro piscar */
  .day-col.fade-in{ animation:fadeIn 0.5s ease both; }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .day-col .day-header{
    background:linear-gradient(100deg,var(--blue),var(--blue-dark));
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    font-weight:800;
    text-transform:uppercase;
  }
  .day-col.is-today .day-header{
    background:linear-gradient(100deg,#FF9A4D,var(--orange-dark));
  }
  .day-header .dname{
    flex:1;
    min-width:0;
    font-size:clamp(16px,1.5vw,24px);
    letter-spacing:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .day-header .date{
    background:#EAF2FF;
    color:#0A2A66;
    font-size:clamp(18px,1.8vw,28px);
    padding:2px 10px;
    border-radius:8px;
    white-space:nowrap;
  }
  .day-col.is-today .day-header .date{ background:#FFF1E6; color:#6E2C07; }


  .day-body{
    padding:12px;
    position:relative;
    overflow:hidden;
    flex:1;
    min-height:0;
  }
  .day-scroll{
    display:flex;
    flex-direction:column;
    gap:10px;
    will-change:transform;
  }

  .ship-card{
    --st:var(--gray);
    position:relative;
    display:flex;
    min-height:116px;
    background:#fff;
    border-radius:10px;
    border:1px solid var(--border);
    overflow:hidden;
    box-shadow:0 2px 6px rgba(20,40,80,0.06);
  }
  /* faixa lateral na cor do status, com o texto a 90° */
  .ship-card .st-band{
    width:34px;
    flex-shrink:0;
    background:var(--st);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ship-card .st-band span{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .ship-card .ship-body{
    flex:1;
    min-width:0;
    padding:12px 46px 12px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
  }
  .ship-card .title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ship-card .crm-tag{
    background:#EEF1F5;
    color:#1D232C;
    font-size:clamp(15px,1.4vw,20px);
    font-weight:800;
    padding:1px 8px;
    border-radius:6px;
  }
  .ship-card .cliente{
    font-size:clamp(17px,1.7vw,25px);
    font-weight:800;
    color:#141414;
    line-height:1.15;
    overflow-wrap:anywhere;
  }
  .ship-card .roteiro{ font-size:clamp(13px,1.2vw,17px); color:#5B6472; }
  /* posição na fila: aba laranja Rodriaço encaixada no canto superior direito */
  .ship-card .queue-tab{
    position:absolute;
    top:0;
    right:0;
    min-width:34px;
    height:34px;
    padding:0 5px;
    background:#EB7831;
    color:#fff;
    font-size:17px;
    font-weight:800;
    letter-spacing:-0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:0 0 0 8px;
  }

  .ship-card.st-emrota{ --st:#1F6FE0; }
  .ship-card.st-entregue{ --st:var(--green); }
  .ship-card.st-reagendado{ --st:var(--purple); }
  .ship-card.st-prototipo{ --st:#B8860B; }
  .ship-card.st-planejado{ --st:#6B7380; }
  .ship-card.st-cancelado{ --st:#3F454E; opacity:0.6; }
  .ship-card.st-cancelado .cliente{ text-decoration:line-through; }

  .ship-card.st-atrasado{
    --st:var(--red);
    animation:cardBlink 1.1s infinite;
  }
  @keyframes cardBlink{
    0%,100%{ background:#fff; box-shadow:0 2px 6px rgba(20,40,80,0.06); }
    50%{ background:#FFE1E1; box-shadow:0 0 16px rgba(229,32,32,0.55); }
  }

  .day-empty{
    color:#aab3c0;
    font-size:13px;
    text-align:center;
    margin:auto;
    font-style:italic;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:#8993a1;
    padding:6px 10px 10px;
  }

  @media (max-width:1100px){
    .week-grid{ grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width:680px){
    .week-grid{ grid-template-columns:repeat(1,1fr); }
    header{ justify-content:center; text-align:center; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="name">RODRIAÇO</span>
    <div class="sub">
      <span class="tagline">Cozinhas Profissionais</span>
      <span class="partner">sodexo</span>
    </div>
  </div>

  <div class="title-wrap">
    <h1>CRONOGRAMA DE <span>EMBARQUES</span></h1>
    <div class="clock" id="clock"></div>
  </div>

  <div class="stats">
    <div class="stat entregue"><div class="lbl">Entregue</div><div class="val" id="statEntregue">0</div></div>
    <div class="stat emrota"><div class="lbl">Em Rota</div><div class="val" id="statEmRota">0</div></div>
    <div class="stat semana"><div class="lbl">Semana</div><div class="val" id="statSemana">0</div></div>
    <div class="stat hoje"><div class="lbl">Hoje</div><div class="val" id="statHoje">0</div></div>
    <div class="stat atrasado" id="statAtrasadoBox"><div class="lbl">Atraso</div><div class="val" id="statAtrasado">0</div></div>
  </div>
</header>

<div id="errorBanner"></div>

<main>
  <div class="week-grid" id="weekGrid"></div>
</main>

<footer id="lastUpdated">Carregando…</footer>

<script>
// ====== PREENCHA COM OS DADOS DO SEU PROJETO SUPABASE ======
// Project Settings > API no painel do Supabase.
const SUPABASE_URL = "https://ewdskrroiihikixdzodu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ix38aPX8oWKAOT3gcqrprQ_1RAxVoc4";
// =============================================================
const FALLBACK_POLL_MS = 5 * 60 * 1000; // rede de segurança, caso o realtime caia

let supabaseClient = null;
let supabaseConfigured = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;
if (supabaseConfigured){
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e){
    supabaseConfigured = false;
  }
}

let rows = [];
let lastRenderSignature = null;
let firstPaint = true;

function stripAccents(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g,"");
}

function classifyStatus(raw){
  const s = stripAccents((raw||"").trim().toUpperCase());
  if (s === "ATRASADO") return {key:"atrasado", label:"Atrasado"};
  if (s === "EM ROTA") return {key:"emrota", label:"Em Rota"};
  if (s === "ENTREGUE") return {key:"entregue", label:"Entregue"};
  if (s === "REAGENDADO") return {key:"reagendado", label:"Reagendado"};
  if (s === "PROTOTIPO") return {key:"prototipo", label:"Protótipo"};
  if (s === "CANCELADO") return {key:"cancelado", label:"Cancelado"};
  if (s === "") return {key:"planejado", label:"Planejado"};
  return {key:"planejado", label: raw};
}

function parseDataField(raw){
  raw = (raw||"").trim();
  // aceita "20/04" e também "20/04/2026"
  const m = raw.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return null;
  const day = parseInt(m[1],10);
  const month = parseInt(m[2],10) - 1;
  if (m[3]){
    let y = parseInt(m[3],10);
    if (y < 100) y += 2000;
    const explicit = new Date(y, month, day);
    return explicit.getMonth() === month ? explicit : null;
  }
  const now = new Date();
  let best = null, bestDiff = Infinity;
  for (let yOffset=-1; yOffset<=1; yOffset++){
    const y = now.getFullYear() + yOffset;
    const candidate = new Date(y, month, day);
    if (candidate.getMonth() !== month) continue;
    const diff = Math.abs(candidate.getTime() - now.getTime());
    if (diff < bestDiff){ bestDiff = diff; best = candidate; }
  }
  return best;
}

function fmtDate(d){
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  return `${dd}/${mm}`;
}

function isSameDay(a,b){
  return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function startOfWeek(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadData(){
  const errorBanner = document.getElementById("errorBanner");
  if (!supabaseConfigured){
    errorBanner.style.display = "block";
    errorBanner.textContent = "Configuração pendente: preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do <script> deste arquivo.";
    return;
  }
  try {
    const { data, error } = await supabaseClient
      .from("embarques")
      .select("seq,cliente,data,roteiro,status")
      .order("seq", { ascending: true });
    if (error) throw error;

    const parsed = data.map(r => {
      const clienteRaw = (r.cliente||"").trim();
      const crmMatch = clienteRaw.match(/^(\d{2,6})[\s-]*(.*)$/);
      const crm = crmMatch ? crmMatch[1] : "";
      const cliente = crmMatch ? crmMatch[2].trim() : clienteRaw;
      const dataRaw = (r.data||"").trim();
      const dateObj = parseDataField(dataRaw);
      const statusInfo = classifyStatus(r.status);
      return {
        seq: r.seq,
        crm,
        cliente,
        dataRaw: dataRaw || "—",
        dateObj,
        roteiro: (r.roteiro||"").trim(),
        statusKey: statusInfo.key,
        status: statusInfo.label
      };
    });
    rows = parsed;
    document.getElementById("lastUpdated").textContent =
      "Tempo real (Supabase) · última atualização às " + new Date().toLocaleTimeString("pt-BR");
    errorBanner.style.display = "none";

    // Só redesenha se algo realmente mudou. Sem isso, cada atualização
    // recria os cards à toa: o quadro pisca e as colunas que estão rolando
    // voltam para o começo. A data de hoje entra na assinatura para o
    // quadro virar sozinho na passagem de um dia para o outro.
    const signature = new Date().toDateString() + "|" + data.map(r =>
      [r.seq, r.cliente, r.data, r.roteiro, r.status].join("~")
    ).join("|");
    if (signature === lastRenderSignature) return;
    lastRenderSignature = signature;
    render();
  } catch (err){
    errorBanner.style.display = "block";
    errorBanner.textContent = "Não foi possível atualizar agora (" + err.message + "). Mostrando os últimos dados carregados.";
  }
}

// O Supabase dispara um evento POR LINHA alterada. Como o Apps Script grava
// as 236 linhas de uma vez, chegaria uma rajada de centenas de eventos.
// Aqui esperamos a rajada terminar e recarregamos uma única vez.
let realtimeDebounce = null;
function scheduleReload(){
  clearTimeout(realtimeDebounce);
  realtimeDebounce = setTimeout(loadData, 1000);
}

function subscribeRealtime(){
  if (!supabaseConfigured) return;
  supabaseClient
    .channel("embarques-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "embarques" }, scheduleReload)
    .subscribe();
}

function render(){
  renderStats();
  renderWeek();
}

function renderStats(){
  const today = new Date();
  const weekStart = startOfWeek(today);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+6);
  weekEnd.setHours(23,59,59,999);

  const c = { entregue:0, emrota:0, atrasado:0, hoje:0, semana:0 };
  for (const r of rows){
    if (r.statusKey === "entregue") c.entregue++;
    if (r.statusKey === "emrota") c.emrota++;
    if (r.statusKey === "atrasado") c.atrasado++;
    if (r.dateObj && isSameDay(r.dateObj, today)) c.hoje++;
    if (r.dateObj && r.dateObj >= weekStart && r.dateObj <= weekEnd) c.semana++;
  }

  document.getElementById("statEntregue").textContent = c.entregue;
  document.getElementById("statEmRota").textContent = c.emrota;
  document.getElementById("statSemana").textContent = c.semana;
  document.getElementById("statHoje").textContent = c.hoje;
  document.getElementById("statAtrasado").textContent = c.atrasado;
  document.getElementById("statAtrasadoBox").classList.toggle("alert", c.atrasado > 0);
}

// Guarda a "impressão digital" do conteúdo de cada coluna já desenhada,
// para recriar apenas as que mudaram. Recriar uma coluna zera a rolagem
// dela, então mexer só no necessário mantém as outras correndo sem parar.
const dayCache = {};

function renderWeek(){
  const today = new Date();
  const weekStart = startOfWeek(today);
  const dayNames = ["SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA"];
  const grid = document.getElementById("weekGrid");
  const rebuilt = [];

  for (let i=0;i<5;i++){
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate()+i);
    const isToday = isSameDay(d, today);
    const dayRows = rows.filter(r => r.dateObj && isSameDay(r.dateObj, d));

    const signature = fmtDate(d) + "|" + isToday + "|" + dayRows.map(r =>
      [r.crm, r.cliente, r.roteiro, r.statusKey, r.status].join("~")
    ).join("|");

    const cached = dayCache[i];
    if (cached && cached.signature === signature && cached.col.isConnected){
      continue; // esta coluna não mudou: não encosta nela, a rolagem segue
    }

    const col = document.createElement("div");
    col.className = "day-col" + (isToday ? " is-today" : "") + (firstPaint ? " fade-in" : "");
    let innerHtml = "";
    if (dayRows.length === 0){
      innerHtml = `<div class="day-empty">Sem embarques</div>`;
    } else {
      innerHtml = dayRows.map((r, idx) => `
        <div class="ship-card st-${r.statusKey}">
          <div class="st-band"><span>${escapeHtml(r.status)}</span></div>
          <div class="ship-body">
            <div class="title">${r.crm ? `<span class="crm-tag">${escapeHtml(r.crm)}</span>` : ""}<span class="cliente">${escapeHtml(r.cliente)}</span></div>
            <div class="roteiro">📍 ${escapeHtml(r.roteiro || "—")}</div>
          </div>
          <span class="queue-tab">${idx+1}</span>
        </div>
      `).join("");
    }
    col.innerHTML = `<div class="day-header"><span class="dname">${dayNames[i]}</span><span class="date">${fmtDate(d)}</span></div><div class="day-body"><div class="day-scroll">${innerHtml}</div></div>`;

    if (cached && cached.col.isConnected){
      grid.replaceChild(col, cached.col); // troca no lugar, preservando a ordem
    } else {
      grid.appendChild(col);
    }
    dayCache[i] = { signature: signature, col: col };
    rebuilt.push(i);
  }

  firstPaint = false;
  if (rebuilt.length) setupAutoScroll(rebuilt);
}

const AUTOSCROLL_PX_PER_SEC = 26;
const AUTOSCROLL_MIN_OVERFLOW = 6;

function setupAutoScroll(indices){
  // Espera o layout assentar antes de medir: logo após criar os elementos
  // as alturas ainda são 0 e TODAS as colunas pareceriam estar estourando,
  // sendo duplicadas e animadas sem necessidade.
  requestAnimationFrame(() => requestAnimationFrame(() => applyAutoScroll(indices)));
}

// Cada coluna tem seu próprio <style>: assim, reconfigurar uma coluna nunca
// reescreve o CSS das outras (o que cortaria a animação delas no meio).
function styleElFor(i){
  const id = "autoScrollStyles-" + i;
  let el = document.getElementById(id);
  if (!el){
    el = document.createElement("style");
    el.id = id;
    document.head.appendChild(el);
  }
  return el;
}

function applyAutoScroll(indices){
  const cols = document.querySelectorAll(".day-col");
  indices.forEach(i => {
    const col = cols[i];
    if (!col) return;
    const body = col.querySelector(".day-body");
    const scrollEl = col.querySelector(".day-scroll");
    if (!body || !scrollEl || body.clientHeight <= 0) return; // ainda não dá pra medir
    // Measure the height of ONE full set of cards before duplicating —
    // the loop must travel exactly this much, not just the overflow past
    // the visible area, otherwise the reset snaps back visibly.
    const singleSetHeight = Math.round(scrollEl.scrollHeight);
    const overflow = singleSetHeight - body.clientHeight;
    const styleEl = styleElFor(i);
    if (overflow > AUTOSCROLL_MIN_OVERFLOW && scrollEl.children.length){
      // Duplicate the card list once so the loop wraps seamlessly:
      // once the animation scrolls exactly one set's height, the copy
      // underneath lines up pixel-for-pixel with the original start.
      scrollEl.innerHTML += scrollEl.innerHTML;
      const duration = singleSetHeight / AUTOSCROLL_PX_PER_SEC;
      const name = `ascroll${i}`;
      styleEl.textContent = `@keyframes ${name}{
        0%{ transform:translateY(0); }
        100%{ transform:translateY(-${singleSetHeight}px); }
      }`;
      scrollEl.style.animation = `${name} ${duration.toFixed(2)}s linear infinite`;
    } else {
      styleEl.textContent = "";
      scrollEl.style.animation = "none";
      scrollEl.style.transform = "translateY(0)";
    }
  });
}

function tickClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleString("pt-BR", { weekday:"long", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
tickClock();
setInterval(tickClock, 1000);

render();
loadData();
subscribeRealtime();
setInterval(loadData, FALLBACK_POLL_MS);
</script>

</body>
